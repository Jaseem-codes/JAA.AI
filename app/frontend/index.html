<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JAA.AI — AI Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
    min-height: 100vh;
}

.app {
    width: 96%;
    max-width: 1250px;
    height: 92vh;
    margin: 4vh auto;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: #111827;
    color: white;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #ffffff;
    color: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.logo-text {
    font-size: 20px;
    font-weight: 700;
}

.new-chat,
.upload-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #1f2937;
    color: white;
    cursor: pointer;
    margin-bottom: 10px;
    font-size: 14px;
}

.new-chat:hover,
.upload-btn:hover {
    background: #374151;
}

#pdfInput {
    display: none;
}

.upload-status {
    font-size: 12px;
    color: #cbd5e1;
    margin: 4px 3px 18px;
    line-height: 1.5;
}

.section-title {
    color: #9ca3af;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 9px;
}

#historyList {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 9px;
    margin-bottom: 5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 7px;
    font-size: 13px;
}

.history-item:hover,
.history-item.active {
    background: #374151;
}

.history-title-text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
}

.delete-chat-btn {
    border: none;
    background: transparent;
    color: #cbd5e1;
    cursor: pointer;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 72px;
    padding: 15px 22px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand h1 {
    font-size: 21px;
}

.brand p {
    margin-top: 3px;
    font-size: 12px;
    color: #64748b;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #64748b;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
}

.clear-btn {
    margin-left: 15px;
    border: 1px solid #e5e7eb;
    background: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.clear-btn:hover {
    background: #f8fafc;
}

/* CHAT */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
}

.message {
    display: flex;
    margin-bottom: 20px;
}

.ai {
    justify-content: flex-start;
}

.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 78%;
    padding: 14px 17px;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}

.ai .bubble {
    background: #f1f5f9;
    border-bottom-left-radius: 4px;
}

.user .bubble {
    background: #111827;
    color: white;
    border-bottom-right-radius: 4px;
}

.typing {
    color: #64748b;
    font-style: italic;
}

.source-box {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #cbd5e1;
    font-size: 11px;
    color: #64748b;
}

/* INPUT */

.input-area {
    padding: 15px 18px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 10px;
    background: #ffffff;
}

#question {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 11px;
    padding: 13px 15px;
    font-size: 14px;
    outline: none;
}

#question:focus {
    border-color: #64748b;
}

.send-btn {
    border: none;
    background: #111827;
    color: white;
    padding: 0 22px;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 600;
}

.send-btn:hover {
    background: #374151;
}

.send-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 700px) {

    .app {
        width: 100%;
        height: 100vh;
        margin: 0;
        border-radius: 0;
    }

    .sidebar {
        width: 190px;
    }

    #chat {
        padding: 18px;
    }

    .bubble {
        max-width: 90%;
    }
}

@media (max-width: 520px) {

    .sidebar {
        width: 150px;
        padding: 12px;
    }

    .logo-text {
        font-size: 17px;
    }

    .logo-icon {
        width: 32px;
        height: 32px;
    }

    .header {
        padding: 12px;
    }

    .status {
        display: none;
    }

    .brand h1 {
        font-size: 18px;
    }

    .bubble {
        max-width: 95%;
        font-size: 14px;
    }

    .send-btn {
        padding: 0 15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">J</div>
            <div class="logo-text">JAA.AI</div>
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <input
            type="file"
            id="pdfInput"
            accept=".pdf,application/pdf"
            onchange="uploadPDF()"
        >

        <button
            class="upload-btn"
            onclick="document.getElementById('pdfInput').click()"
        >
            📄 Upload PDF
        </button>

        <div id="uploadStatus" class="upload-status">
            No PDF uploaded
        </div>

        <div class="section-title">
            Chat History
        </div>

        <div id="historyList"></div>

    </aside>


    <main class="main">

        <header class="header">

            <div class="brand">
                <h1>JAA.AI</h1>
                <p>AI Assistant • RAG • Web Search</p>
            </div>

            <div style="display:flex;align-items:center;">

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>

                <button
                    class="clear-btn"
                    onclick="clearChat()"
                >
                    Clear
                </button>

            </div>

        </header>


        <div id="chat">

            <div class="message ai">

                <div class="bubble">
                    Hello! 👋 I am JAA.AI.

                    Ask me anything, upload a PDF,
                    or ask questions about your documents.
                </div>

            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask JAA.AI something..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                id="sendButton"
                onclick="askAI()"
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>

const input = document.getElementById("question");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");
const historyList = document.getElementById("historyList");
const pdfInput = document.getElementById("pdfInput");
const uploadStatus = document.getElementById("uploadStatus");

const API_BASE = window.location.origin;

let sessionId = crypto.randomUUID();

let chatHistory = [];


// =========================
// PDF UPLOAD
// =========================

async function uploadPDF() {

    const file = pdfInput.files[0];

    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".pdf")) {

        uploadStatus.textContent =
            "❌ Only PDF files are allowed.";

        pdfInput.value = "";

        return;
    }

    uploadStatus.textContent =
        "⏳ Uploading and indexing PDF...";

    const formData = new FormData();

    formData.append("file", file);

    try {

        const response = await fetch(
            `${API_BASE}/upload`,
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Upload failed"
            );
        }

        uploadStatus.textContent =
            `✅ ${data.filename} uploaded\n` +
            `Pages: ${data.pages} | Chunks: ${data.chunks}`;

        addMessage(
            `PDF uploaded successfully: ${data.filename}\n\n` +
            `Pages: ${data.pages}\n` +
            `Chunks: ${data.chunks}\n\n` +
            `You can now ask questions about this PDF.`,
            "ai"
        );

    } catch (error) {

        console.error("PDF Upload Error:", error);

        uploadStatus.textContent =
            "❌ PDF upload failed.";

        addMessage(
            "Sorry, the PDF could not be uploaded.",
            "ai"
        );

    } finally {

        pdfInput.value = "";

    }
}


// =========================
// HISTORY
// =========================

function saveHistory() {

    localStorage.setItem(
        "jaa_ai_history",
        JSON.stringify(chatHistory)
    );
}


function loadHistory() {

    const saved =
        localStorage.getItem("jaa_ai_history");

    if (saved) {

        try {
            chatHistory = JSON.parse(saved);
        } catch {
            chatHistory = [];
        }

    }

    renderHistory();
}


function renderHistory() {

    historyList.innerHTML = "";

    chatHistory.forEach((item, index) => {

        const historyItem =
            document.createElement("div");

        historyItem.className =
            "history-item";

        if (item.id === sessionId) {
            historyItem.classList.add("active");
        }

        const title =
            document.createElement("span");

        title.className =
            "history-title-text";

        title.textContent =
            item.title || "New Chat";

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-chat-btn";

        deleteButton.textContent = "🗑️";

        deleteButton.onclick =
            function(event) {

                event.stopPropagation();

                deleteChat(
                    item.id,
                    index
                );

            };

        historyItem.appendChild(title);
        historyItem.appendChild(deleteButton);

        historyItem.onclick =
            function() {
                loadChat(index);
            };

        historyList.appendChild(historyItem);

    });
}


function createHistoryItem(question) {

    const title =
        question.length > 30
            ? question.substring(0, 30) + "..."
            : question;

    chatHistory.unshift({
        id: sessionId,
        title: title
    });

    saveHistory();
    renderHistory();
}


// =========================
// NEW CHAT
// =========================

function newChat() {

    sessionId =
        crypto.randomUUID();

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble">
                Hello! 👋 I am JAA.AI. How can I help you?
            </div>
        </div>
    `;

    input.value = "";

    renderHistory();

    input.focus();
}


// =========================
// LOAD CHAT
// =========================

async function loadChat(index) {

    const selected =
        chatHistory[index];

    if (!selected) return;

    sessionId =
        selected.id;

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble typing">
                Loading conversation...
            </div>
        </div>
    `;

    try {

        const response =
            await fetch(
                `${API_BASE}/history/${encodeURIComponent(sessionId)}`
            );

        if (!response.ok) {
            throw new Error();
        }

        const data =
            await response.json();

        chat.innerHTML = "";

        if (
            !data.messages ||
            data.messages.length === 0
        ) {

            addMessage(
                "No messages found in this chat.",
                "ai"
            );

        } else {

            data.messages.forEach(message => {

                addMessage(
                    message.content,
                    message.role === "user"
                        ? "user"
                        : "ai"
                );

            });

        }

    } catch {

        chat.innerHTML = `
            <div class="message ai">
                <div class="bubble">
                    Sorry, I could not load this conversation.
                </div>
            </div>
        `;
    }

    renderHistory();

    input.focus();

    chat.scrollTop =
        chat.scrollHeight;
}


// =========================
// DELETE CHAT
// =========================

async function deleteChat(
    sessionIdToDelete,
    index
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this chat?"
        );

    if (!confirmed) return;

    try {

        const response =
            await fetch(
                `${API_BASE}/history/${encodeURIComponent(sessionIdToDelete)}`,
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {
            throw new Error();
        }

        chatHistory.splice(index, 1);

        saveHistory();
        renderHistory();

        if (
            sessionId === sessionIdToDelete
        ) {
            newChat();
        }

    } catch {

        alert(
            "Could not delete this chat."
        );
    }
}


// =========================
// CLEAR CHAT
// =========================

function clearChat() {

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble">
                Hello! 👋 I am JAA.AI. How can I help you?
            </div>
        </div>
    `;

    input.focus();
}


// =========================
// ASK AI
// =========================

async function askAI() {

    const question =
        input.value.trim();

    if (!question) return;

    addMessage(
        question,
        "user"
    );

    input.value = "";

    sendButton.disabled = true;

    sendButton.textContent =
        "Thinking...";

    const typingMessage =
        addMessage(
            "JAA.AI is thinking...",
            "ai",
            true
        );

    try {

        const response =
            await fetch(
                `${API_BASE}/ask?question=${encodeURIComponent(question)}&session_id=${encodeURIComponent(sessionId)}`
            );

        if (!response.ok) {
            throw new Error();
        }

        const data =
            await response.json();

        const bubble =
            typingMessage.querySelector(
                ".bubble"
            );

        bubble.textContent =
            data.answer;

        if (
            data.sources &&
            data.sources.length > 0
        ) {

            const sourceBox =
                document.createElement(
                    "div"
                );

            sourceBox.className =
                "source-box";

            sourceBox.textContent =
                "📚 Sources: " +
                data.sources.join(", ");

            bubble.appendChild(
                sourceBox
            );
        }

        const alreadyExists =
            chatHistory.some(
                item =>
                    item.id === sessionId
            );

        if (!alreadyExists) {

            createHistoryItem(
                question
            );
        }

    } catch (error) {

        console.error(
            "JAA.AI Error:",
            error
        );

        typingMessage
            .querySelector(".bubble")
            .textContent =
            "Sorry, I could not connect to JAA.AI.";

    } finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "Send";

        input.focus();
    }

    chat.scrollTop =
        chat.scrollHeight;
}


// =========================
// ADD MESSAGE
// =========================

function addMessage(
    text,
    type,
    typing = false
) {

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    if (typing) {
        bubble.classList.add("typing");
    }

    bubble.textContent =
        text;

    message.appendChild(
        bubble
    );

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


// =========================
// ENTER KEY
// =========================

input.addEventListener(
    "keypress",
    function(event) {

        if (
            event.key === "Enter" &&
            !sendButton.disabled
        ) {
            askAI();
        }

    }
);


loadHistory();

</script>

</body>
</html>
