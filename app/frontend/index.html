<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JAA.AI — AI Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
    min-height: 100vh;
}

.app {
    width: 96%;
    max-width: 1250px;
    height: 92vh;
    margin: 4vh auto;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: #111827;
    color: white;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #ffffff;
    color: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.logo-text {
    font-size: 20px;
    font-weight: 700;
}

.new-chat,
.upload-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #1f2937;
    color: white;
    cursor: pointer;
    margin-bottom: 10px;
    font-size: 14px;
}

.new-chat:hover,
.upload-btn:hover {
    background: #374151;
}

#pdfInput {
    display: none;
}
#imageInput {
    display: none;
}
.upload-status {
    font-size: 12px;
    color: #cbd5e1;
    margin: 4px 3px 18px;
    line-height: 1.5;
}

.section-title {
    color: #9ca3af;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 9px;
}

#historyList {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 9px;
    margin-bottom: 5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 7px;
    font-size: 13px;
}

.history-item:hover,
.history-item.active {
    background: #374151;
}

.history-title-text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
}

.delete-chat-btn {
    border: none;
    background: transparent;
    color: #cbd5e1;
    cursor: pointer;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 72px;
    padding: 15px 22px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand h1 {
    font-size: 21px;
}

.brand p {
    margin-top: 3px;
    font-size: 12px;
    color: #64748b;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #64748b;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
}

.clear-btn {
    margin-left: 15px;
    border: 1px solid #e5e7eb;
    background: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.clear-btn:hover {
    background: #f8fafc;
}

/* CHAT */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
}

.message {
    display: flex;
    margin-bottom: 20px;
}

.ai {
    justify-content: flex-start;
}

.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 78%;
    padding: 14px 17px;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}

.ai .bubble {
    background: #f1f5f9;
    border-bottom-left-radius: 4px;
}

.user .bubble {
    background: #111827;
    color: white;
    border-bottom-right-radius: 4px;
}

.typing {
    color: #64748b;
    font-style: italic;
}

.source-box {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #cbd5e1;
    font-size: 11px;
    color: #64748b;
}

/* AI VOICE BUTTON */

.voice-answer-btn {
    margin-top: 10px;
    border: 1px solid #cbd5e1;
    background: white;
    color: #111827;
    padding: 7px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
}

.voice-answer-btn:hover {
    background: #e2e8f0;
}

/* INPUT */

.input-area {
    padding: 15px 18px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 8px;
    background: #ffffff;
}

#question {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 11px;
    padding: 13px 15px;
    font-size: 14px;
    outline: none;
}

#question:focus {
    border-color: #64748b;
}

/* VOICE INPUT BUTTON */

.mic-btn {
    width: 48px;
    border: 1px solid #d1d5db;
    background: white;
    color: #111827;
    border-radius: 11px;
    cursor: pointer;
    font-size: 18px;
}

.mic-btn:hover {
    background: #f1f5f9;
}

.mic-btn.listening {
    background: #111827;
    color: white;
    border-color: #111827;
}

.send-btn {
    border: none;
    background: #111827;
    color: white;
    padding: 0 22px;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 600;
}

.send-btn:hover {
    background: #374151;
}

.send-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

/* VOICE STATUS */

.voice-status {
    position: absolute;
    bottom: 78px;
    right: 25px;
    background: #111827;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    display: none;
    z-index: 10;
}

/* MOBILE */

@media (max-width: 700px) {

    .app {
        width: 100%;
        height: 100vh;
        margin: 0;
        border-radius: 0;
    }

    .sidebar {
        width: 190px;
    }

    #chat {
        padding: 18px;
    }

    .bubble {
        max-width: 90%;
    }
}

@media (max-width: 520px) {

    .sidebar {
        width: 150px;
        padding: 12px;
    }

    .logo-text {
        font-size: 17px;
    }

    .logo-icon {
        width: 32px;
        height: 32px;
    }

    .header {
        padding: 12px;
    }

    .status {
        display: none;
    }

    .brand h1 {
        font-size: 18px;
    }

    .bubble {
        max-width: 95%;
        font-size: 14px;
    }

    .send-btn {
        padding: 0 15px;
    }

    .mic-btn {
        width: 44px;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">J</div>
            <div class="logo-text">JAA.AI</div>
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <input
            type="file"
            id="pdfInput"
            accept=".pdf,application/pdf"
            onchange="uploadPDF()"
        >

        <button
            class="upload-btn"
            onclick="document.getElementById('pdfInput').click()"
        >
            📄 Upload PDF
        </button>

        <div id="uploadStatus" class="upload-status">
            No PDF uploaded
        </div>
        <input
    type="file"
    id="imageInput"
    accept="image/png,image/jpeg,image/webp"
    onchange="uploadImage()"
>

<button
    class="upload-btn"
    onclick="document.getElementById('imageInput').click()"
>
    🖼️ Upload Image
</button>

<div id="imageStatus" class="upload-status">
    No image uploaded
</div>

        <div class="section-title">
            Chat History
        </div>

        <div id="historyList"></div>

    </aside>


    <main class="main">

        <header class="header">

            <div class="brand">
                <h1>JAA.AI</h1>
                <p>AI Assistant • RAG • Web Search</p>
            </div>

            <div style="display:flex;align-items:center;">

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>

                <button
                    class="clear-btn"
                    onclick="clearChat()"
                >
                    Clear
                </button>

            </div>

        </header>


        <div id="chat">

            <div class="message ai">

                <div class="bubble">
                    Hello! 👋 I am JAA.AI.

                    Ask me anything, upload a PDF,
                    or ask questions about your documents.
                </div>

            </div>

        </div>


        <div class="voice-status" id="voiceStatus">
            🎤 Listening...
        </div>


        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask JAA.AI something..."
                autocomplete="off"
            >

            <button
                class="mic-btn"
                id="micButton"
                onclick="startVoiceInput()"
                title="Speak"
            >
                🎤
            </button>

            <button
                class="send-btn"
                id="sendButton"
                onclick="askAI()"
            >
                Send
            </button>

        </div>

    </main>

</div>


<script>
let selectedImageId = null;
const input = document.getElementById("question");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");
const historyList = document.getElementById("historyList");
const pdfInput = document.getElementById("pdfInput");
const uploadStatus = document.getElementById("uploadStatus");
const imageInput = document.getElementById("imageInput");
const imageStatus = document.getElementById("imageStatus");

const micButton = document.getElementById("micButton");
const voiceStatus = document.getElementById("voiceStatus");

const API_BASE = window.location.origin;

let sessionId = crypto.randomUUID();

let chatHistory = [];


// =========================
// VOICE RECOGNITION
// =========================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

console.log("Speech Recognition:", SpeechRecognition);

let recognition = null;
let isListening = false;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = true;

   recognition.lang = "en-IN";


    recognition.onstart = function() {

        isListening = true;

        micButton.classList.add("listening");

        micButton.textContent = "⏹️";

        voiceStatus.style.display = "block";

        voiceStatus.textContent =
            "🎤 Listening...";
    };


    recognition.onresult = function(event) {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            transcript +=
                event.results[i][0].transcript;
        }

        input.value = transcript;

    };


    recognition.onend = function() {

        isListening = false;

        micButton.classList.remove("listening");

        micButton.textContent = "🎤";

        voiceStatus.style.display = "none";

        input.focus();

    };


    recognition.onerror = function(event) {

    console.log("VOICE ERROR:", event.error);

    isListening = false;

    micButton.classList.remove("listening");

    micButton.textContent = "🎤";

    voiceStatus.style.display = "none";

};
        }

    



// =========================
// START VOICE INPUT
// =========================

function startVoiceInput() {

alert("MIC BUTTON CLICKED");

    if (!SpeechRecognition) {
        alert("Voice input is not supported. Please use Google Chrome.");
        return;
    }

    if (!recognition) {
        recognition = new SpeechRecognition();

        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = "hi-IN";

        recognition.onstart = function() {
            isListening = true;
            micButton.classList.add("listening");
            micButton.textContent = "⏹️";
            voiceStatus.style.display = "block";
            voiceStatus.textContent = "🎤 Listening...";
        };

        recognition.onresult = function(event) {

            let transcript = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {
                transcript += event.results[i][0].transcript;
            }

            input.value = transcript;
        };

        recognition.onend = function() {
            isListening = false;
            micButton.classList.remove("listening");
            micButton.textContent = "🎤";
            voiceStatus.style.display = "none";
        };

        recognition.onerror = function(event) {
    alert("VOICE ERROR: " + event.error);

    isListening = false;

    micButton.classList.remove("listening");
    micButton.textContent = "🎤";
    voiceStatus.style.display = "none";

    alert("Voice error: " + event.error);
};
    }

    if (isListening) {
        recognition.stop();
        return;
    }

    try {
        recognition.start();
    } catch (error) {
        console.log("Voice start error:", error);
    }
}


// =========================
// TEXT TO SPEECH
// =========================

function speakAnswer(text, button) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Text-to-speech is not supported by this browser."
        );

        return;
    }


    if (speechSynthesis.speaking) {

        speechSynthesis.cancel();

        if (button) {
            button.textContent = "🔊 Read";
        }

        return;
    }


    const cleanText =
        text
            .replace(
                /https?:\/\/\S+/g,
                ""
            )
            .trim();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );

    utterance.lang = "en-IN";

    utterance.rate = 0.95;

    utterance.pitch = 1;


    utterance.onstart = function() {

        if (button) {
            button.textContent = "⏹️ Stop";
        }

    };


    utterance.onend = function() {

        if (button) {
            button.textContent = "🔊 Read";
        }

    };


    utterance.onerror = function() {

        if (button) {
            button.textContent = "🔊 Read";
        }

    };


    speechSynthesis.speak(
        utterance
    );

}

// =========================
// IMAGE UPLOAD
// =========================

async function uploadImage() {

    const file = imageInput.files[0];

    if (!file) return;

    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

        imageStatus.textContent =
            "❌ Only PNG, JPG or WEBP images are allowed.";

        imageInput.value = "";

        return;
    }

    imageStatus.textContent =
        "⏳ Uploading image...";

    const formData = new FormData();

    formData.append("file", file);

    try {

        const response = await fetch(
            `${API_BASE}/upload-image`,
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Image upload failed"
            );
        }
selectedImageId = data.image_id;
        imageStatus.textContent =
    `✅ ${data.filename} uploaded successfully`;

// Show uploaded image in chat
const imageMessage = document.createElement("div");

imageMessage.className = "message user";

const imageBubble = document.createElement("div");

imageBubble.className = "bubble";

const img = document.createElement("img");

img.src = URL.createObjectURL(file);
img.alt = "Uploaded image";

img.style.maxWidth = "350px";
img.style.maxHeight = "350px";
img.style.borderRadius = "12px";
img.style.display = "block";

imageBubble.appendChild(img);
imageMessage.appendChild(imageBubble);

chat.appendChild(imageMessage);

chat.scrollTop = chat.scrollHeight;

addMessage(
    `Image uploaded successfully: ${data.filename}`,
    "ai"
);

    } catch (error) {

        console.error("Image Upload Error:", error);

        imageStatus.textContent =
            "❌ Image upload failed.";

    } finally {

        imageInput.value = "";

    }
}
// =========================
// PDF UPLOAD
// =========================

async function uploadPDF() {

    const file = pdfInput.files[0];

    if (!file) return;

    if (
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ) {

        uploadStatus.textContent =
            "❌ Only PDF files are allowed.";

        pdfInput.value = "";

        return;
    }

    uploadStatus.textContent =
        "⏳ Uploading and indexing PDF...";

    const formData = new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response = await fetch(
            `${API_BASE}/upload`,
            {
                method: "POST",
                body: formData
            }
        );

        const data =
            await response.json();
            



    
        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Upload failed"
            );
        }

        uploadStatus.textContent =
            `✅ ${data.filename} uploaded\n` +
            `Pages: ${data.pages} | Chunks: ${data.chunks}`;

        addMessage(
            `PDF uploaded successfully: ${data.filename}\n\n` +
            `Pages: ${data.pages}\n` +
            `Chunks: ${data.chunks}\n\n` +
            `You can now ask questions about this PDF.`,
            "ai"
        );

    } catch (error) {

        console.error(
            "PDF Upload Error:",
            error
        );

        uploadStatus.textContent =
            "❌ PDF upload failed.";

        addMessage(
            "Sorry, the PDF could not be uploaded.",
            "ai"
        );

    } finally {

        pdfInput.value = "";

    }
}


// =========================
// HISTORY
// =========================

function saveHistory() {

    localStorage.setItem(
        "jaa_ai_history",
        JSON.stringify(chatHistory)
    );
}


function loadHistory() {

    const saved =
        localStorage.getItem(
            "jaa_ai_history"
        );

    if (saved) {

        try {

            chatHistory =
                JSON.parse(saved);

        } catch {

            chatHistory = [];

        }

    }

    renderHistory();
}


function renderHistory() {

    historyList.innerHTML = "";

    chatHistory.forEach(
        (item, index) => {

            const historyItem =
                document.createElement(
                    "div"
                );

            historyItem.className =
                "history-item";

            if (
                item.id === sessionId
            ) {

                historyItem.classList.add(
                    "active"
                );

            }

            const title =
                document.createElement(
                    "span"
                );

            title.className =
                "history-title-text";

            title.textContent =
                item.title ||
                "New Chat";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-chat-btn";

            deleteButton.textContent =
                "🗑️";


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteChat(
                        item.id,
                        index
                    );

                };


            historyItem.appendChild(
                title
            );

            historyItem.appendChild(
                deleteButton
            );


            historyItem.onclick =
                function() {

                    loadChat(index);

                };


            historyList.appendChild(
                historyItem
            );

        }
    );
}


function createHistoryItem(question) {

    const title =
        question.length > 30
            ? question.substring(
                0,
                30
              ) + "..."
            : question;

    chatHistory.unshift({
        id: sessionId,
        title: title
    });

    saveHistory();

    renderHistory();
}


// =========================
// NEW CHAT
// =========================

function newChat() {

    speechSynthesis.cancel();

    sessionId =
        crypto.randomUUID();

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble">
                Hello! 👋 I am JAA.AI. How can I help you?
            </div>
        </div>
    `;

    input.value = "";

    renderHistory();

    input.focus();
}


// =========================
// LOAD CHAT
// =========================

async function loadChat(index) {

    const selected =
        chatHistory[index];

    if (!selected) return;

    speechSynthesis.cancel();

    sessionId =
        selected.id;

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble typing">
                Loading conversation...
            </div>
        </div>
    `;

    try {

        const response =
            await fetch(
                `${API_BASE}/history/${encodeURIComponent(sessionId)}`
            );

        if (!response.ok) {
            throw new Error();
        }

        const data =
            await response.json();

        chat.innerHTML = "";

        if (
            !data.messages ||
            data.messages.length === 0
        ) {

            addMessage(
                "No messages found in this chat.",
                "ai"
            );

        } else {

            data.messages.forEach(
                message => {

                    addMessage(
                        message.content,
                        message.role === "user"
                            ? "user"
                            : "ai",
                        false,
                        message.role === "assistant"
                    );

                }
            );

        }

    } catch {

        chat.innerHTML = `
            <div class="message ai">
                <div class="bubble">
                    Sorry, I could not load this conversation.
                </div>
            </div>
        `;

    }

    renderHistory();

    input.focus();

    chat.scrollTop =
        chat.scrollHeight;
}


// =========================
// DELETE CHAT
// =========================

async function deleteChat(
    sessionIdToDelete,
    index
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this chat?"
        );

    if (!confirmed) return;

    try {

        const response =
            await fetch(
                `${API_BASE}/history/${encodeURIComponent(sessionIdToDelete)}`,
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {
            throw new Error();
        }

        chatHistory.splice(
            index,
            1
        );

        saveHistory();

        renderHistory();

        if (
            sessionId ===
            sessionIdToDelete
        ) {

            newChat();

        }

    } catch {

        alert(
            "Could not delete chat."
        );

    }
}


// =========================
// CLEAR CHAT
// =========================

function clearChat() {

    speechSynthesis.cancel();

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble">
                Hello! 👋 I am JAA.AI. How can I help you?
            </div>
        </div>
    `;

    input.focus();
}


// =========================
// ASK AI
// =========================

async function askAI() {

    const question =
        input.value.trim();
const imageId = selectedImageId || null;
    if (!question) return;

    addMessage(
        question,
        "user"
    );

    input.value = "";

    sendButton.disabled = true;

    micButton.disabled = true;

    sendButton.textContent =
        "Thinking...";


    const typingMessage =
        addMessage(
            "JAA.AI is thinking...",
            "ai",
            true
        );


    try {

       let response;

if (selectedImageId) {
console.log("IMAGE ID:", selectedImageId);
    response = await fetch(
        `${API_BASE}/ask-image`,
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                image_id: selectedImageId,
                question: question
            })
        }
    );

} else {

    response = await fetch(
        `${API_BASE}/ask?question=${encodeURIComponent(question)}&session_id=${encodeURIComponent(sessionId)}`
    );
}


        if (!response.ok) {

            let errorMessage =
                "JAA.AI could not process your request.";

            try {

                const errorData =
                    await response.json();

                if (errorData.detail) {
                    errorMessage =
                        errorData.detail;
                }

            } catch {}

            throw new Error(
                errorMessage
            );
        }


        const data =
            await response.json();


        const bubble =
            typingMessage.querySelector(
                ".bubble"
            );


        bubble.classList.remove(
            "typing"
        );


let listNumber = 0;
let insideList = false;

const lines = data.answer.split("\n");

const cleanedLines = lines.map(function(line, index) {

    // Markdown headings remove
    line = line.replace(/^#{1,6}\s*/g, "");

    // Bold / italic marks remove
    line = line.replace(/\*\*/g, "");
    line = line.replace(/\*/g, "");

    // // remove
    line = line.replace(/^\/\/\s*/g, "");

    // Quotes remove
    line = line.replace(/"/g, "");

    // Table | remove
    line = line.replace(/\|/g, "");

    // Separator lines remove
    if (/^\s*-{3,}\s*$/.test(line)) {
        return "";
    }

    // Numbered list OR bullet list
    const listMatch =
        line.match(/^\s*(?:\d+\.\s+|-\s+)(.*)$/);

    if (listMatch) {

        if (!insideList) {
            listNumber = 1;
            insideList = true;
        } else {
            listNumber++;
        }

        return listNumber + ". " + listMatch[1];
    }

    // Non-list line
    insideList = false;

    return line.trim();

});

const cleanAnswer =
    cleanedLines.join("\n");

bubble.textContent =
    cleanAnswer;


            if (selectedImageId) {
    selectedImageId = null;
}


        // =========================
        // READ ANSWER BUTTON
        // =========================

        const voiceButton =
            document.createElement(
                "button"
            );

        voiceButton.className =
            "voice-answer-btn";

        voiceButton.textContent =
            "🔊 Read";


        voiceButton.onclick =
            function() {

                speakAnswer(
                    data.answer,
                    voiceButton
                );

            };


        bubble.appendChild(
            voiceButton
        );


        // =========================
        // SOURCES
        // =========================

        if (
            data.sources &&
            data.sources.length > 0
        ) {

            const sourceBox =
                document.createElement(
                    "div"
                );

            sourceBox.className =
                "source-box";


            sourceBox.textContent =
                "📚 Sources: " +
                data.sources.join(
                    ", "
                );


            bubble.appendChild(
                sourceBox
            );

        }


        const alreadyExists =
            chatHistory.some(
                item =>
                    item.id === sessionId
            );


        if (!alreadyExists) {

            createHistoryItem(
                question
            );

        }


    } catch (error) {

        console.error(
            "JAA.AI Error:",
            error
        );


        typingMessage
            .querySelector(
                ".bubble"
            )
            .textContent =
            error.message ||
            "Sorry, I could not connect to JAA.AI.";

    } finally {

        sendButton.disabled =
            false;

        micButton.disabled =
            false;

        sendButton.textContent =
            "Send";

        input.focus();

    }


    chat.scrollTop =
        chat.scrollHeight;
}


// =========================
// ADD MESSAGE
// =========================

function addMessage(
    text,
    type,
    typing = false,
    isAssistant = false
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        `message ${type}`;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    if (typing) {

        bubble.classList.add(
            "typing"
        );

    }


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    if (
        isAssistant &&
        !typing
    ) {

        const voiceButton =
            document.createElement(
                "button"
            );

        voiceButton.className =
            "voice-answer-btn";

        voiceButton.textContent =
            "🔊 Read";


        voiceButton.onclick =
            function() {

                speakAnswer(
                    text,
                    voiceButton
                );

            };


        bubble.appendChild(
            voiceButton
        );

    }


    return message;
}


// =========================
// ENTER KEY
// =========================

input.addEventListener(
    "keypress",
    function(event) {

        if (
            event.key === "Enter" &&
            !sendButton.disabled
        ) {

            askAI();

        }

    }
);

// STOP SPEECH WHEN PAGE CLOSES
// =========================

window.addEventListener(
    "beforeunload",
    function() {

        if (
            "speechSynthesis" in window
        ) {

            speechSynthesis.cancel();

        }

    }
);

loadHistory();
